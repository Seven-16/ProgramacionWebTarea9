name: Deploy Blazor a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar
        run: dotnet publish Tarea9/examen1.csproj -c Release -o release

      - name: Ajustar base href
        run: sed -i 's|<base href="/" />|<base href="/ProgramacionWebTarea9/" />|' release/wwwroot/index.html

      - name: Evitar que Jekyll ignore archivos
        run: touch release/wwwroot/.nojekyll

      - name: Soporte para rutas (SPA)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4